<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aspect ratio and image fitting | CSS interview exercises</title>
    <link rel="stylesheet" href="../../base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="demo-header">
      <span class="eyebrow">15 / Responsive</span>
      <h1>Aspect ratio and image fitting</h1>
      <p class="lead">
        Both frames are square; cover crops while contain preserves the complete image.
      </p>
      <a href="../../index.html">All exercises</a>
    </header>
    <main class="demo-main">
      <div class="stage images">
        <figure>
          <div class="media">
            <img
              class="cover"
              src="../../assets/landscape.svg"
              alt="Illustrated mountains and a sun"
            />
          </div>
          <figcaption>object-fit: cover</figcaption>
        </figure>
        <figure>
          <div class="media">
            <img
              class="contain"
              src="../../assets/landscape.svg"
              alt="The same complete mountain illustration"
            />
          </div>
          <figcaption>object-fit: contain</figcaption>
        </figure>
      </div>
    </main>
  </body>
</html>
