<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Triangles made from borders | CSS interview exercises</title>
    <link rel="stylesheet" href="../../base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="demo-header">
      <span class="eyebrow">18 / Shapes</span>
      <h1>Triangles made from borders</h1>
      <p class="lead">A zero-content-size box exposes the joins between its borders.</p>
      <a href="../../index.html">All exercises</a>
    </header>
    <main class="demo-main">
      <div class="stage shapes">
        <figure>
          <div class="triangle up" aria-hidden="true"></div>
          <figcaption>Up</figcaption>
        </figure>
        <figure>
          <div class="triangle right" aria-hidden="true"></div>
          <figcaption>Right</figcaption>
        </figure>
        <figure>
          <div class="triangle down" aria-hidden="true"></div>
          <figcaption>Down</figcaption>
        </figure>
        <figure>
          <div class="triangle left" aria-hidden="true"></div>
          <figcaption>Left</figcaption>
        </figure>
      </div>
    </main>
  </body>
</html>
