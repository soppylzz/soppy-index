<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loading indicators | CSS interview exercises</title>
    <link rel="stylesheet" href="../../base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="demo-header">
      <span class="eyebrow">21 / Motion</span>
      <h1>Loading indicators</h1>
      <p class="lead">
        Keyframes animate decorative shapes; reduced-motion preferences disable them.
      </p>
      <a href="../../index.html">All exercises</a>
    </header>
    <main class="demo-main">
      <div class="stage">
        <label><input class="pause" type="checkbox" /> Pause animation</label>
        <div class="loaders" role="status">
          <span class="spinner" aria-hidden="true"></span
          ><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span
          ><span>Loading preview</span>
        </div>
        <p class="reduced-note">Reduced motion is enabled; the indicators are static.</p>
      </div>
    </main>
  </body>
</html>
