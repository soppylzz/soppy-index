<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Double-wing layout | CSS interview exercises</title>
    <link rel="stylesheet" href="../../base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="demo-header">
      <span class="eyebrow">07 / Layout</span>
      <h1>Double-wing layout</h1>
      <p class="lead">The center wrapper floats at full width; an inner box reserves the sides.</p>
      <a href="../../index.html">All exercises</a>
    </header>
    <main class="demo-main">
      <div class="stage">
        <div class="layout">
          <div class="center-wrap">
            <section class="sample-panel alt center">
              <h2>Center wrapper comes first</h2>
              <p>Inner margins reserve side space.</p>
            </section>
          </div>
          <aside class="sample-panel left">Left: 9rem</aside>
          <aside class="sample-panel right">Right: 8rem</aside>
        </div>
      </div>
    </main>
  </body>
</html>
